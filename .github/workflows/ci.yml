name: Backend CI

on:
  push:
    branches: [main, staging]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/abdazz/tenderai-bf

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry install --extras "full" --with dev
      - name: Lint
        run: |
          poetry run ruff check src tests
          poetry run ruff format --check src tests
      - name: Type check
        continue-on-error: true
        run: poetry run mypy src/tenderai_bf
      - name: Test
        run: poetry run pytest tests/ -v --no-cov -m "not slow and not integration"

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [lint-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - name: Free up runner disk space
        run: |
          # ubuntu-latest ships several GB of toolchains this project never
          # uses (dotnet, Android SDK, GHC, etc.) — the "full" extras install
          # (playwright, spacy, crawl4ai, onnxruntime) needs the room, and
          # the first build attempt failed mid-poetry-install with
          # "No space left on device".
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af --volumes || true
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          platforms: linux/amd64
